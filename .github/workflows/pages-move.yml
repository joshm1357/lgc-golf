name: Move to app.thegolftrip.club (hand-over page)

# Run by hand ONLY at release B, after app.thegolftrip.club is live and tested.
# Publishes move-to-app-domain/ to GitHub Pages in place of the app. See docs/LAUNCH-HOSTING.md, step B5.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MOVE to replace the old app with the hand-over page'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'MOVE' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: move-to-app-domain
      - id: deployment
        uses: actions/deploy-pages@v4
