# Edge Function settings. 'notify' checks the caller itself (member token, or the
# daily scheduler's secret header), so the gateway's token check must stay off —
# otherwise the daily reminders get refused.
[functions.notify]
verify_jwt = false

# The L.G.C connector checks its own secret key (last part of the URL); Claude sends no Supabase token.
[functions.lgc-mcp]
verify_jwt = false

# The course-list seeding job checks its own token (kept in the database); the database starts it with pg_net.
[functions.seed-osm-courses]
verify_jwt = false

# The AI helper checks the person's sign-in itself (it refuses a request without a valid token), and its live
# commentary mode (071) is called by the database's every-minute job with the cron secret instead of a token — so the
# gateway's token check is off for it too.
[functions.ai-helper]
verify_jwt = false

# 079: the one-tap answer links in vote emails. No sign-in: the link's own token (random, stored hashed, one person,
# one vote, expires when the vote closes) is the check — see supabase/functions/vote-link/logic.ts.
[functions.vote-link]
verify_jwt = false
